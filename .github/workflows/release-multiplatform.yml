name: Publicar Multiplataforma

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      platform:
        description: Plataforma que se compila (all, windows, android o pwa)
        type: string
        default: all

permissions:
  contents: write

# Todos los puntos de entrada comparten este bloqueo para evitar adjuntos en conflicto.
concurrency:
  group: organify-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Comprobar versiones
        id: version
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const platform = process.env.PLATFORM || 'all';
          if (!['all', 'windows', 'android', 'pwa'].includes(platform)) throw new Error('Plataforma desconocida');
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const web = read('apps/web/package.json').version;
          const mobile = read('apps/mobile/package.json').version;
          const desktop = read('apps/desktop/package.json');
          const tauri = read('apps/desktop/src-tauri/tauri.conf.json').version;
          const numericVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const [desktopBase, ...suffix] = desktop.version.split('-');
          const prerelease = suffix.length > 0;
          const prereleaseId = /^(?:0|[1-9]\d*|[\dA-Za-z-]*[A-Za-z-][\dA-Za-z-]*)$/;
          const isWindowsHotfix = platform === 'windows' && !prerelease && desktop.version !== web;
          if (![web, mobile, desktopBase].every(version => numericVersion.test(version))
              || desktop.version !== tauri || web !== mobile
              || (!isWindowsHotfix && desktopBase !== web)
              || (prerelease && (platform !== 'windows' || !suffix.join('-').split('.').every(id => prereleaseId.test(id))))) {
            throw new Error('Mantén alineadas las versiones. Solo Publicar Windows admite correcciones independientes y versiones preliminares como 0.14.0-beta.1.');
          }
          if (isWindowsHotfix) {
            const base = web.split('.').map(BigInt);
            const next = desktop.version.split('.').map(BigInt);
            const changed = next.findIndex((part, index) => part !== base[index]);
            if (next[changed] <= base[changed]) throw new Error('La corrección de Windows debe superar la versión común.');
          }
          const version = isWindowsHotfix || prerelease ? desktop.version : web;
          const label = isWindowsHotfix ? (desktop.releaseLabel || `v${version}`) : `v${version}`;
          if (!/^[a-zA-Z0-9.+-]+$/.test(label)) throw new Error('Nombre de release no válido.');
          appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\ntitle=Organify ${label}\nwindows_hotfix=${isWindowsHotfix}\nprerelease=${prerelease}\n`);
          JS
      - name: Conservar el manifiesto Android publicado
        if: steps.version.outputs.windows_hotfix == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern android.json --dir "$RUNNER_TEMP"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const manifest = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'android.json'), 'utf8'));
          const prefix = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/`;
          if (manifest.applicationId !== 'app.organify.personal'
              || !Number.isSafeInteger(manifest.versionCode) || manifest.versionCode < 1
              || typeof manifest.apkUrl !== 'string'
              || !manifest.apkUrl.startsWith(prefix) || !manifest.apkUrl.endsWith('.apk')) {
            throw new Error('El manifiesto Android publicado debe apuntar a un APK versionado del repositorio.');
          }
          JS
      - name: Preparar borrador de release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
          WINDOWS_HOTFIX: ${{ steps.version.outputs.windows_hotfix }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "v$VERSION" --json isDraft,isPrerelease,targetCommitish > release-state.json; then
            node -e "const r = require('./release-state.json'); if (!r.isDraft) throw new Error('Esta version ya esta publicada. Incrementa la version para una nueva publicacion.'); if (r.targetCommitish !== process.env.GITHUB_SHA) throw new Error('El borrador debe apuntar al mismo commit. Usa una version nueva o corrige el destino del borrador.'); if (r.isPrerelease !== (process.env.PRERELEASE === 'true')) throw new Error('El borrador debe tener el mismo canal que la compilacion.')"
          elif [ "$PRERELEASE" = true ]; then
            gh release create "v$VERSION" --draft --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TITLE"
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "$RELEASE_TITLE"
          fi
          # Una etiqueta existente debe representar el mismo codigo que se compila.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            git fetch origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" || { echo 'La etiqueta pertenece a otro commit. Incrementa la version.' >&2; exit 1; }
          fi
          if [ "$WINDOWS_HOTFIX" = true ]; then
            gh release upload "v$VERSION" "$RUNNER_TEMP/android.json" --clobber
          fi
  release-windows:
    runs-on: windows-latest
    needs: prepare
    if: inputs.platform != 'android' && inputs.platform != 'pwa'
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ORGANIFY_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Preparar configuración del actualizador
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY -or $env:UPDATER_ENDPOINT -notmatch '^https://') {
            throw 'Configura TAURI_UPDATER_PUBLIC_KEY y TAURI_UPDATER_ENDPOINT antes de publicar.'
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'organify-updater.json'
          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBLIC_KEY
                endpoints = @($env:UPDATER_ENDPOINT)
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
          "ORGANIFY_UPDATER_CONFIG=$configPath" >> $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: --config "${{ env.ORGANIFY_UPDATER_CONFIG }}"
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: ${{ needs.prepare.outputs.title }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
  release-android:
    needs: prepare
    if: inputs.platform != 'windows' && inputs.platform != 'pwa'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ORGANIFY_ANDROID_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/android.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Preparar SDK de Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validar secretos de firma Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Falta ANDROID_KEYSTORE_BASE64.' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Falta ANDROID_KEYSTORE_PASSWORD.' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Falta ANDROID_KEY_ALIAS.' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Falta ANDROID_KEY_PASSWORD.' >&2; exit 1; }
          python3 - <<'PY'
          import os, sys
          for name in ("KEYSTORE_PASSWORD", "KEY_PASSWORD"):
              if not os.environ[name].isascii():
                  print(f"{name} debe contener solo caracteres ASCII.", file=sys.stderr)
                  sys.exit(1)
          PY
      - name: Crear proyecto Android y sincronizar la app
        run: |
          corepack pnpm --filter @organify/mobile android:add
          corepack pnpm --filter @organify/mobile android:sync
      - name: Configurar versión y firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/organify-release.jks"
          node apps/mobile/configure-release.mjs "$RUNNER_TEMP/organify-release.jks"
      - name: Compilar APK firmado
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Adjuntar APK firmado a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./apps/mobile/package.json').version")
          fi
          APK_NAME="Organify-android-v${VERSION}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const { version } = JSON.parse(await (await import('node:fs/promises')).readFile('apps/mobile/package.json', 'utf8'));
          const [major, minor, patch] = version.split('.').map(Number);
          writeFileSync('android.json', JSON.stringify({
            applicationId: 'app.organify.personal',
            versionCode: major * 1000000 + minor * 1000 + patch,
            apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/Organify-android-v${version}.apk`
          }, null, 2));
          JS
          gh release upload "v$VERSION" "$APK_NAME" android.json --clobber

  release-pwa:
    needs: prepare
    if: inputs.platform != 'windows' && inputs.platform != 'android'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @organify/web build
      - name: Empaquetar PWA
        working-directory: apps/web/dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: zip -r "../../../Organify-PWA-v${VERSION}.zip" .
      - name: Adjuntar PWA a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v$VERSION" "Organify-PWA-v$VERSION.zip" --clobber
